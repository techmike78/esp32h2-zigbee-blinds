[env:esp32-h2-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-h2-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.partitions = zigbee.csv
board_build.f_cpu = 96000000L
board_build.flash_mode = dio
monitor_filters = time, log2file
upload_protocol = esptool
upload_speed = 921600
upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32h2

build_type = debug

; После каждой сборки пересобирает OTA-образ для Z2M (tools/ota_out/) из свежего firmware.bin —
; см. tools/post_build_ota.py и инструкцию в начале src/main.c.
extra_scripts = post:tools/post_build_ota.py
